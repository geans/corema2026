services:
  app:
    build: ./datapipeline
    container_name: pratica-4-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      QDRANT_URL: http://qdrant:6333
      COLLECTION_NAME: COREMA-documents
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
    depends_on:
      qdrant:
        condition: service_healthy
    volumes:
      - embedding_cache:/home/appuser/.cache

  chatbot:
    build: ./chatbot
    container_name: pratica-4-chatbot
    restart: unless-stopped
    ports:
      - "7777:7777"
    environment:
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      QDRANT_URL: http://qdrant:6333
      COLLECTION_NAME: COREMA-documents
    depends_on:
      qdrant:
        condition: service_healthy
    volumes:
      - chatbot_cache:/root/.cache

  qdrant:
    image: qdrant/qdrant:latest
    container_name: pratica-4-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/6333'"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  qdrant_storage:
  embedding_cache:
  chatbot_cache:
